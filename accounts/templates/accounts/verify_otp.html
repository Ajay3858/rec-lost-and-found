<!DOCTYPE html>
<html>
<head>

<title>OTP Verification</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#f4f6f9;
}

.container{

    width:420px;
    margin:70px auto;
    background:white;
    padding:40px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,.15);

}

h2{

    color:#0d6efd;
    text-align:center;

}

p{

    text-align:center;
    color:gray;

}

input{

    width:100%;
    padding:15px;
    font-size:22px;
    text-align:center;
    letter-spacing:8px;
    margin-top:20px;
    border-radius:8px;
    border:1px solid #ccc;

}

button{

    width:100%;
    margin-top:25px;
    padding:14px;
    background:#0d6efd;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;

}

button:hover{

    background:#084db5;

}

.msg{

    color:red;
    text-align:center;
    margin-top:15px;

}

</style>

</head>

<body>

<div class="container">

<h2>REC Lost & Found</h2>

<p>Enter the OTP sent to your REC Email</p>

<form method="POST">

{% csrf_token %}

<input
type="text"
name="otp"
maxlength="6"
placeholder="Enter OTP"
required>

<button type="submit">

Verify OTP

</button>

</form>

{% if messages %}

{% for message in messages %}

<div class="msg">

{{ message }}

</div>

{% endfor %}

{% endif %}

</div>

</body>

</html>
